name: One-time add exam result dashboard standard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_one_time_add_exam_result_dashboard.yml

permissions:
  contents: write

jobs:
  update-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add result dashboard standard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("SINAV_OLUSTURMA.md")
          text = path.read_text(encoding="utf-8-sig")
          marker = "# 48. SINAV SONUÇ PANOSU VE GÖRSEL PERFORMANS ANALİZİ"

          section = r'''
---

# 48. SINAV SONUÇ PANOSU VE GÖRSEL PERFORMANS ANALİZİ

Bu bölüm bir renk, tema veya sayfa tasarımı standardı değildir.

> **Bu bölüm, HTML sınavların sonuç ekranında bulunması gereken işlevleri belirler.**

Görsel görünüm değişebilir; aşağıdaki hesaplama, analiz ve raporlama işlevleri korunmalıdır.

## 48.1 ZORUNLU SONUÇ ÖZETİ

Sınav tamamlandığında sonuç ekranının üst bölümünde en az şu bilgiler birlikte gösterilmelidir:

- **Puan / toplam puan**
- **Doğru sayısı**
- **Yanlış sayısı**
- **Boş sayısı**
- **Başarı oranı**
- **Kullanılan süre**

Gerçek sınavda yanlışlar doğruları götürmediğinden:

**Puan = Doğru sayısı**

olmalıdır.

Başarı oranı:

**Doğru sayısı / toplam soru sayısı × 100**

formülüyle hesaplanmalıdır.

## 48.2 PASTA / DONUT GRAFİKLERİ

Sonuç ekranında sayısal özetin yanında görsel performans özeti bulunmalıdır.

En az aşağıdaki görsellerden biri kullanılmalıdır:

1. **Doğru / yanlış / boş dağılımını gösteren pasta veya donut grafik**
2. **Genel başarı oranını gösteren dairesel başarı göstergesi**

Mümkünse ikisi birlikte kullanılmalıdır.

Grafikler:

- Gerçek cevap verilerinden dinamik olarak hesaplanmalı,
- Metin olarak gösterilen doğru, yanlış, boş ve başarı değerleriyle tamamen aynı olmalı,
- Sabit veya örnek değer içermemeli,
- Haricî grafik kütüphanesine ihtiyaç duymadan çevrimdışı çalışmalıdır.

Grafik herhangi bir nedenle görüntülenemezse sayısal sonuçlar yine okunabilir durumda kalmalıdır.

## 48.3 ANA ALAN PERFORMANS TABLOSU

Her sorunun ait olduğu ana alan sınav verisinde tutulmalıdır.

Sonuç ekranında en az şu sütunları içeren bir ana alan tablosu bulunmalıdır:

| Ana Alan | Soru | Doğru | Yanlış | Boş | Başarı |
|---|---:|---:|---:|---:|---:|

Gerçek sınav simülasyonunda tablodaki **Soru** adetleri, ilgili `00_SINAV_DAGILIMI.md` dosyalarına göre oluşturulan gerçek soru dağılımıyla aynı olmalıdır.

Tablodaki bütün ana alanların soru toplamı sınavın toplam soru sayısına eşit olmalıdır.

## 48.4 ANA ALAN BAŞARI SIRASI

Ana alan performansları ayrıca kullanıcının kendi sonuçları içinde başarı oranına göre sıralanmalıdır.

Bu sıralama:

1. Başarı oranı yüksekten düşüğe,
2. Eşitlik halinde doğru sayısı yüksekten düşüğe,
3. Eşitlik devam ederse boş sayısı azdan çoğa

şeklinde yapılabilir.

Sonuç ekranında:

- **En güçlü ana alanlar**
- **Öncelikle tekrar edilmesi gereken ana alanlar**

açıkça görülebilmelidir.

Bu, kullanıcılar arası bir Türkiye/genel başarı sıralaması değildir.

Başka adaylara ait doğrulanmış veri ve sunucu altyapısı yoksa kullanıcılar arası sıralama, yüzdelik dilim veya tahmini derece uydurulamaz.

## 48.5 KAYNAK VE SORU HAVUZU BAZLI ANALİZ

Sorular hazırlanırken her soru için mümkün olduğunca şu bilgiler veri yapısında tutulmalıdır:

- Ana alan
- Soru havuzu / kaynak grubu
- Gerçek kaynak dosyası
- PDF sayfası
- Madde
- Fıkra
- Bent

Bu bilgiler güvenilir biçimde tutulmuşsa sonuç ekranında ana alan analizine ek olarak kaynak veya soru havuzu bazlı başarı analizi de gösterilebilir.

Kaynak bilgisi kesin değilse kaynak kırılımı uydurulmamalıdır.

## 48.6 YANLIŞ VE BOŞ SORULARIN KAYNAKLI ANALİZİ

Sonuç panosundan sonra yanlış ve boş sorular ayrı ayrı incelenebilmelidir.

Her yanlış veya boş soru için en az:

- Soru numarası ve soru metni
- Kullanıcının cevabı veya “Boş” bilgisi
- Doğru cevap
- Kısa açıklama
- Ana alan
- Soru havuzu
- Gerçek kaynak
- Güvenilir biçimde bulunabiliyorsa PDF sayfası, madde, fıkra ve bent

gösterilmelidir.

Sayfa, madde, fıkra veya bent kesin değilse boş bırakılmalı; tahmin edilmemelidir.

## 48.7 HESAPLAMA VE VERİ BÜTÜNLÜĞÜ

HTML teslim edilmeden önce aşağıdaki eşitlikler test edilmelidir:

- **Doğru + yanlış + boş = toplam soru**
- **Ana alanlardaki soru toplamı = toplam soru**
- **Ana alan doğru toplamı = genel doğru sayısı**
- **Ana alan yanlış toplamı = genel yanlış sayısı**
- **Ana alan boş toplamı = genel boş sayısı**
- Grafikteki değerler = metinsel sonuç değerleri
- Gerçek sınav puanı = doğru sayısı

Sonuç kartları, tablolar ve grafikler aynı cevap verisinden üretilmelidir.

Ayrı ayrı yazılmış veya sabitlenmiş değerler kullanılmamalıdır.

## 48.8 SINAV MODUNA GÖRE GÖSTERİM ZAMANI

### Gerçek sınavda

Sonuç panosu, pasta/donut grafikler, ana alan başarı sırası, doğru cevaplar ve kaynaklı analiz yalnızca sınav teslim edildikten veya süre dolduktan sonra gösterilir.

### Çalışma, tek konu, karşılaştırmalı ve karma çalışma sınavlarında

Soru bazlı doğru/yanlış geri bildirimi sınav türünün kuralına göre anında gösterilebilir.

Bununla birlikte sınavın sonunda yine toplu sonuç panosu ve performans analizi oluşturulmalıdır.

### Adaptif sınavda

Toplu sonuç panosuna ek olarak:

- En çok hata yapılan konular,
- Tekrar edilmesi gereken kaynaklar,
- Süre/limit/yetki/istisna hata yoğunluğu

gösterilmelidir.

## 48.9 ÇEVRİMDIŞI ÇALIŞMA VE RAPOR

Sonuç panosunun bütün işlevleri tek HTML dosyasında ve çevrimdışı çalışmalıdır.

Mümkünse:

- Sınav ilerlemesi ve sonuçlar `localStorage` ile korunmalı,
- Sonuç raporu yazdırılabilmeli,
- Sayfa yenilendiğinde teslim edilmiş sınav sonucu kaybolmamalıdır.

## 48.10 TESLİM ÖNCESİ EK İŞLEV TESTİ

`HTML TESLİM ÖNCESİ TEST` bölümündeki kontrollere ek olarak şunlar da test edilmelidir:

- Doğru / yanlış / boş sayımı
- Başarı oranı hesabı
- Kullanılan süre hesabı
- Pasta/donut grafik verileri
- Ana alan tablosu
- Ana alan başarı sırası
- En güçlü ve en zayıf alanların tespiti
- Yanlış/boş filtreleme
- Kaynaklı analiz açma-kapama
- Sonuçların sayfa yenilemesinden sonra korunması

> **Sınav yalnızca soru soran bir HTML değil; cevapları güvenilir biçimde ölçen, dağılıma göre analiz eden ve kullanıcıya neyi tekrar etmesi gerektiğini gösteren bir çalışma aracıdır.**
'''.strip()

          if marker not in text:
              text = text.rstrip() + "\n\n" + section + "\n"
              path.write_text(text, encoding="utf-8")
              print("Result dashboard standard appended.")
          else:
              print("Marker already exists; no change needed.")
          PY

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- SINAV_OLUSTURMA.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SINAV_OLUSTURMA.md
          git commit -m "docs: standardize exam result dashboard"
          git push
