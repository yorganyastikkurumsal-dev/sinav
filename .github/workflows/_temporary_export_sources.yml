name: Temporary generate source-backed learning exams

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: python -m pip install --quiet pypdf

      - name: Patch temporary generator template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/generate_learning_exams.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bad.forEach(({q,i})=>', 'bad.forEach(({{q,i}})=>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate learning exam package
        run: python .github/scripts/generate_learning_exams.py

      - name: Upload learning exam package
        uses: actions/upload-artifact@v4
        with:
          name: PTT-2026-ana-alan-calisma-sinavlari
          path: generated_learning_exams/*
          retention-days: 1
